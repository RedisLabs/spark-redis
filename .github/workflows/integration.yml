name: Continuous Integration
on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
    branches:
      - master
      - '[0-9].*'
  pull_request:
    branches:
      - master
      - '[0-9].*'
  schedule:
    - cron: '0 1 * * *' # nightly build
  workflow_dispatch:

jobs:

  build:
    name: Build and Test (Spark ${{ matrix.spark }}, Scala ${{ matrix.scala-binary }}, Redis ${{ matrix.redis }})
    # Not ubuntu-latest: since November 2026 that is Ubuntu 26.04, which has no Java 8, so every job downloaded the
    # newest Temurin 8 from GitHub releases, and the jdk8u514-b01 download fails its checksum. Ubuntu 24.04 has
    # Temurin 8 in its tool cache, which setup-java uses without downloading anything.
    runs-on: ubuntu-24.04
    strategy:
      # run every Spark version even if one of them fails
      fail-fast: false
      matrix:
        # Like Spark 3.x, every Spark version is tested with its Scala 2.12 and its Scala 2.13 build, each with the
        # Scala version that Spark build uses: scala-library is only backward compatible, so an older one can miss
        # methods that Spark calls.
        include:
          # the version the library is built and released with (spark.version in pom.xml), on the default Scala 2.13
          # build and on Scala 2.12
          - spark: '3.5.10'
            scala-binary: '2.13'
            scala: '2.13.8'
            redis: '7.4'
            coverage: true
          - spark: '3.5.10'
            scala-binary: '2.12'
            scala: '2.12.18'
            redis: '7.4'
          # the newest Redis line, on the default build. Every entry names its Redis version: an entry that only added
          # a key would be merged into the entry above instead of becoming a job of its own
          - spark: '3.5.10'
            scala-binary: '2.13'
            scala: '2.13.8'
            redis: '8.6'
          # older Spark lines that the library supports
          - spark: '3.2.1'
            scala-binary: '2.12'
            scala: '2.12.15'
            redis: '7.4'
          - spark: '3.2.1'
            scala-binary: '2.13'
            scala: '2.13.5'
            redis: '7.4'
          - spark: '3.3.3'
            scala-binary: '2.12'
            scala: '2.12.15'
            redis: '7.4'
          - spark: '3.3.3'
            scala-binary: '2.13'
            scala: '2.13.8'
            redis: '7.4'
          - spark: '3.4.2'
            scala-binary: '2.12'
            scala: '2.12.17'
            redis: '7.4'
          - spark: '3.4.2'
            scala-binary: '2.13'
            scala: '2.13.8'
            redis: '7.4'
    env:
      MVN_ARGS: -Dspark.version=${{ matrix.spark }} -Dscala.complete.version=${{ matrix.scala }}
      # The tests start Redis in Docker with Testcontainers (src/test/scala/.../env/RedisContainers.scala). 7.4 is the
      # oldest Redis version the library supports.
      REDIS_IMAGE: redis:${{ matrix.redis }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set Java up in the runner
        # No Maven cache here: the Setup Maven step caches ~/.m2/repository per Spark version.
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.22.0
        with:
          # The project is already checked out above.
          checkout-enabled: 'false'
          # Pin these: newer releases of this action default to Zulu and a
          # newer Maven, which would replace the Temurin JDK set up above.
          java-version: '8'
          java-distribution: 'temurin'
          maven-version: '3.9.2'
          # one Maven cache per Spark and Scala version: the cache key is otherwise only based on pom.xml, so all the
          # matrix jobs would share one entry that holds the dependencies of a single Spark build
          cache-prefix: spark-${{ matrix.spark }}-scala-${{ matrix.scala-binary }}-
      - name: Switch the build to Scala ${{ matrix.scala-binary }}
        # pom.xml builds for Scala 2.13. The same script the release uses, so that the spark-redis_2.12 build is tested
        # as it is published
        if: matrix.scala-binary != '2.13'
        run: dev/change-scala-version.sh ${{ matrix.scala-binary }}
      - name: Show the Redis version under test
        run: docker run --rm "$REDIS_IMAGE" redis-server --version
      - name: Maven offline
        run: |
          mvn -q dependency:go-offline $MVN_ARGS
      - name: Run tests
        run: make test REDIS_IMAGE="$REDIS_IMAGE" MVN_ARGS="$MVN_ARGS"
        env:
          JVM_OPTS: -Xmx3200m
          TERM: dumb
      - name: Upload coverage reports to Codecov
        # once, from the build of the released Spark version
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
