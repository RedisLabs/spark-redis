name: Continuous Integration
on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
    branches:
      - master
      - '[0-9].*'
  pull_request:
    branches:
      - master
      - '[0-9].*'
  schedule:
    - cron: '0 1 * * *' # nightly build
  workflow_dispatch:

jobs:

  build:
    name: Build and Test (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    strategy:
      # run every Spark version even if one of them fails
      fail-fast: false
      matrix:
        # Each Spark version is paired with the Scala version it is built with: scala-library is only backward
        # compatible, so an older one can miss methods that Spark calls.
        include:
          # the version the library is built and released with (spark.version in pom.xml)
          - spark: '3.5.10'
            scala: '2.12.18'
            coverage: true
          # older Spark lines that the library supports
          - spark: '3.2.1'
            scala: '2.12.15'
          - spark: '3.3.3'
            scala: '2.12.15'
          - spark: '3.4.2'
            scala: '2.12.17'
    env:
      MVN_ARGS: -Dspark.version=${{ matrix.spark }} -Dscala.complete.version=${{ matrix.scala }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set Java up in the runner
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.22.0
        with:
          # The project is already checked out above.
          checkout-enabled: 'false'
          # Pin these: newer releases of this action default to Zulu and a
          # newer Maven, which would replace the Temurin JDK set up above.
          java-version: '8'
          java-distribution: 'temurin'
          maven-version: '3.9.2'
      - name: Install missing dependencies to container
        run: |
          sudo apt update
          sudo apt install -y libssl-dev
          wget http://download.redis.io/releases/redis-6.0.10.tar.gz
          tar -xzvf redis-6.0.10.tar.gz
          make -C redis-6.0.10 -j`nproc` BUILD_TLS=yes
      - name: Maven offline
        run: |
          mvn -q dependency:go-offline $MVN_ARGS
      - name: Run tests
        run: |
          export PATH=$PWD/redis-6.0.10/src:$PATH
          make test MVN_ARGS="$MVN_ARGS"
        env:
          JVM_OPTS: -Xmx3200m
          TERM: dumb
      - name: Upload coverage reports to Codecov
        # once, from the build of the released Spark version
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
