name: Release

on:
  release:
    types: [published]

jobs:
  build:
    # Ubuntu 24.04 has Temurin 8 in its tool cache; ubuntu-latest (Ubuntu 26.04) has no Java 8, so setup-java would
    # download it from GitHub releases, and the jdk8u514-b01 download fails its checksum.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: get version from tag
        id: get_version
        run: |
          realversion="${GITHUB_REF/refs\/tags\//}"
          realversion="${realversion//v/}"
          realversion=`echo ${realversion}|cut -d '-' -f 2-2`
          echo "VERSION=$realversion" >> "$GITHUB_OUTPUT"

      # Publishes through the Central Publisher Portal (central-publishing-maven-plugin in the release profile).
      # OSSH_USERNAME and OSSH_TOKEN must hold a Portal user token, generated at https://central.sonatype.com/usertoken
      # by an account that can publish com.redislabs. The old OSSRH (oss.sonatype.org) credentials no longer work.
      - name: Set up publishing to maven central
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: mvn versions
        run: mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Install gpg key
        run: |
          cat <(echo -e "${{ secrets.OSSH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publish for Scala 2.12 (spark-redis_2.12)
        run: |
          mvn --no-transfer-progress \
            --batch-mode \
            -Dgpg.passphrase='${{ secrets.OSSH_GPG_SECRET_KEY_PASSWORD }}' \
            -DskipTests deploy -P release
        env:
          MAVEN_USERNAME: ${{secrets.OSSH_USERNAME}}
          MAVEN_PASSWORD: ${{secrets.OSSH_TOKEN}}

      - name: Publish for Scala 2.13 (spark-redis_2.13)
        # Like Spark 3.x, the same release is also published for Scala 2.13. 'clean' so that no class compiled
        # for Scala 2.12 by the previous step ends up in the Scala 2.13 jar.
        run: |
          dev/change-scala-version.sh 2.13
          mvn --no-transfer-progress \
            --batch-mode \
            -Dgpg.passphrase='${{ secrets.OSSH_GPG_SECRET_KEY_PASSWORD }}' \
            -DskipTests clean deploy -P release
        env:
          MAVEN_USERNAME: ${{secrets.OSSH_USERNAME}}
          MAVEN_PASSWORD: ${{secrets.OSSH_TOKEN}}
