# TLS-only standalone Redis for the SSL suites (port 6380). Replaces the Makefile's REDIS_STANDALONE_NODE_CONF_SSL.
# The certificates are generated when the tests run (see TestCertificates.scala). No tls-dh-params-file: Redis 7 and
# later with OpenSSL 3 don't need one, and the JVM client negotiates ECDHE or TLS 1.3, not finite-field DH.
port 0
tls-port 6380
bind 0.0.0.0
protected-mode no
save ""
appendonly no
aclfile /usr/local/etc/redis/users.acl
tls-cert-file /usr/local/etc/redis/tls/redis.crt
tls-key-file /usr/local/etc/redis/tls/redis.key
tls-ca-cert-file /usr/local/etc/redis/tls/ca.crt
tls-auth-clients no
